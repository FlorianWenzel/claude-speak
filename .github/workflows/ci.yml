name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Compile check
        run: uv run --no-project python -m compileall -q src
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-smoke:
    # GitHub's macos-latest runners are Apple silicon, so this exercises the
    # real dependency resolution including mlx
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v5
      - name: Install wheel and run CLI
        run: |
          uv tool install dist/*.whl
          claude-speak --help
      - name: Verify lazy TTS imports resolve
        # kokoro pulls these in lazily at generation time, so --help alone
        # would not catch a missing dependency (misaki bit us once)
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/python -c "import misaki.en, audiotsm, sounddevice, mlx_audio"
